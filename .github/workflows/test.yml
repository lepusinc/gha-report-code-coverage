name: Test

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUNIT_ARTIFACT_PREFIX: test-results
  COVERAGE_ARTIFACT: coverage-results

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      - name: Verify dist/ is up-to-date
        run: |
          npx tsup --out-dir /tmp/dist-verify
          if ! diff dist/index.js /tmp/dist-verify/index.js; then
            echo "dist/ is out of date. Run 'npm run build' and commit the changes."
            exit 1
          fi

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    env:
      JUNIT_OUTPUT_PATH: /tmp/test-results/junit-${{ matrix.node-version }}.xml
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm test
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ${{ env.JUNIT_ARTIFACT_PREFIX }} ${{ matrix.node-version }}
          path: ${{ env.JUNIT_OUTPUT_PATH }}
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.COVERAGE_ARTIFACT }} ${{ matrix.node-version }}
          path: /tmp/coverage/clover.xml

  test-report:
    name: Test Report
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ !cancelled() }}
    permissions:
      checks: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Download test results
        uses: actions/download-artifact@v8
        with:
          path: junit-results
          pattern: "${{ env.JUNIT_ARTIFACT_PREFIX }} *"
          merge-multiple: 'true'

      - name: Report test results
        uses: dorny/test-reporter@v3
        with:
          name: Test results
          path: 'junit-results/**/*.xml'
          reporter: jest-junit
          list-suites: 'all'
          list-tests: 'all'
          fail-on-error: 'true'
          fail-on-empty: 'false'
          use-actions-summary: 'true'
          token: ${{ github.token }}

  coverage-report:
    name: Coverage Report
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          name: ${{ env.COVERAGE_ARTIFACT }} 24
          path: coverage
      - uses: ./
        with:
          file: 'coverage/clover.xml'
          title: 'Test Coverage'
